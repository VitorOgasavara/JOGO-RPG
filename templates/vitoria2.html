
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Reino das Sombras | Vitória</title>

    <style>
        * {
            margin: 0;
            padding: 0;

        body {

            min-height: 100vh;

            background-image: url("{{ url_for('static', filename='imagens/cenarios/nivel2concluido.jpeg') }}");

            background-position: center;

        }

        @media (max-width: 500px) {
